<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Virtual Life</title>
  <link rel="stylesheet" href="/static/style.css?v=3" />
  <!-- Apply saved/system theme before first paint to avoid flash -->
  <script>
    (function () {
      const saved = localStorage.getItem('theme');
      const preferred = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', preferred);
    })();
  </script>
  <!-- We'll use marked.js for client-side markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
</head>

<body>
  <button id="theme_toggle" title="Toggle dark / light mode" aria-label="Toggle theme">
    <span id="theme_icon">🌙</span>
  </button>
  <button id="lang_toggle" title="Switch English / 中文" aria-label="Toggle language">
    <span id="lang_icon">🌐</span>
  </button>
  <div class="container">
    <div id="title_md" class="title"><span id="app_title_text"># Virtual Life Chat</span><br><small id="model_label">Model: google/gemini-3.1-flash-lite-preview</small></div>

    <div class="desktop_shell">
      <!-- Left Panel -->
      <div class="left_panel">
        <div id="chatbox" class="chatbox">
          <!-- Chat messages go here -->
        </div>

        <div class="input_row">
          <textarea id="message_input" rows="1"
            placeholder="Type your message... (Click Send or Cmd/Ctrl+Enter to send)"></textarea>
          <button id="send_btn" class="primary-btn">Send</button>
        </div>
        <div class="quick_actions" style="display:flex; gap:10px; margin-top:8px;">
          <button id="edit_last_btn" class="secondary-btn"
            style="flex:1; font-size:13px; padding:6px; background:var(--quick-btn-bg);" disabled>📝 Edit Last</button>
          <button id="regenerate_btn" class="secondary-btn"
            style="flex:1; font-size:13px; padding:6px; background:var(--quick-btn-bg);" disabled>🔄 Regenerate</button>
        </div>
        <div id="status_md" class="status">
          <p>Ready.</p>
        </div>
      </div>

      <!-- Right Panel -->
      <div class="right_panel">
        <div class="image_upload">
          <label id="upload_image_label">Upload Image (optional)</label>
          <input type="file" id="image_input" accept="image/*" />
          <div id="image_preview"></div>
          <button id="clear_image_btn"
            style="display:none; width:100%; margin-top:5px; border-radius:4px; padding:4px;">Remove Image</button>
        </div>

        <div class="image_upload">
          <label for="model_select" id="model_select_label">Model</label>
          <select id="model_select"></select>
        </div>

        <div class="accordion">
          <button class="accordion-header" id="retained_prompt_header">Retained Prompt</button>
          <div class="accordion-content" id="retained_prompt_content">
            <textarea id="retained_prompt_text" rows="3" placeholder="Last sent prompt will be kept here..."></textarea>
            <div style="display:flex; gap:8px; margin-top:8px;">
              <button id="resend_retained_btn" class="primary-btn" style="flex:1; padding:8px; font-size:13px;">Resend</button>
              <button id="fill_retained_btn" class="secondary-btn" style="flex:1; padding:8px; font-size:13px;">Fill Input</button>
            </div>
            <div style="display:flex; justify-content:flex-end; margin-top:6px;">
              <button id="clear_retained_btn" style="background:transparent; border:none; color:var(--fg-muted); font-size:12px; cursor:pointer;">Clear</button>
            </div>
          </div>
        </div>

        <div class="accordion">
          <button class="accordion-header" id="user_profile_header">User Profile & Context</button>
          <div class="accordion-content">
            <textarea id="user_profile" rows="8"></textarea>
            <button id="save_user_btn" class="secondary-btn">Save Profile</button>
          </div>
        </div>

        <div class="accordion">
          <button class="accordion-header" id="memory_management_header">Memory Management</button>
          <div class="accordion-content">
            <button id="manual_compress_btn" class="secondary-btn">Manual Compress</button>
            <p class="warning-text" id="memory_warning_text" style="font-size:12px; margin-top:10px;">Warning: Consolidating memory.md
              irreversibly rewrites the memory file.</p>
            <input type="text" id="advanced_compress_confirm" placeholder="Type COMPRESS" />
            <button id="advanced_compress_btn" class="danger-btn">Consolidate Memory</button>
          </div>
        </div>

        <div class="accordion">
          <button class="accordion-header" id="danger_zone_header">Danger Zone</button>
          <div class="accordion-content">
            <p class="warning-text" id="danger_warning_text" style="font-size:12px; margin-top:0;"><strong>WARNING:</strong> This action
              permanently deletes ALL history, memory, and uploaded images.</p>
            <input type="text" id="confirm_clear" placeholder="Type CLEAR ALL HISTORY" />
            <button id="clear_btn" class="danger-btn">Clear All History</button>
          </div>
        </div>

        <div style="margin-top:10px;text-align:center;">
          <a href="/logout" id="logout_link" style="color:#64748b;font-size:12px;text-decoration:none;">Logout</a>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/main.js?v=3"></script>
</body>

</html>
